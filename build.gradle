plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = 'https://maven.minecraftforge.net' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    //前置
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${project.minecraft_version}:${project.geckolib_version}")
    //联动
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")
    implementation fg.deobf("local.runtime:jei:1.20.1-forge-15.28.0.160")
    //latex_form处理
    implementation fg.deobf("curse.maven:changed-minecraft-mod-661527:8217446")//可选依赖
    //mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'forge_version': project.forge_version,
                'mod_id': project.mod_id,
                'mod_name': project.mod_name
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('testDietInheritance', JavaExec) {
    group = 'verification'
    description = 'Verifies recipe diet propagation, alternatives, cycles and blacklist corrections.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.onixary.shapeShifterCurseForge.diet.RecipeDietGraphTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.named('check') { dependsOn tasks.named('testDietInheritance') }

mixin {
    add sourceSets.main, 'shape_shifter_curse.mixins.refmap.json'
    config "shape_shifter_curse.mixins.json"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = project.mod_id
            version = project.version

            // ForgeGradle's reobfuscated output is the jar that can run in-game.
            artifact layout.buildDirectory.file('reobfJar/output.jar')
        }
    }
    repositories {
        maven {
            name = 'localModRepository'
            url = layout.projectDirectory.dir('maven-repo')
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    dependsOn 'reobfJar'
}

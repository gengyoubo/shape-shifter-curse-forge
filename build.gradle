buildscript {
    repositories { mavenCentral() }
    // Used by remapImmediatelyFastForDev to rewrite SRG names in a dev-only mod jar.
    dependencies { classpath 'org.ow2.asm:asm-commons:9.7.1' }
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // PlayerAnimator ships SRG refmaps; remap them for the development mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = 'https://maven.minecraftforge.net' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    flatDir {
        dirs 'libs'
    }
}

configurations {
    immediatelyFastDeobf { transitive = false }
}

def immediatelyFastDevJar = layout.buildDirectory.file('devMods/immediatelyfast-dev.jar')

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    //前置
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${project.minecraft_version}:${project.geckolib_version}")
    //联动
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")
    implementation fg.deobf("local.runtime:jei:1.20.1-forge-15.28.0.160")
    // Optional mods for animation compatibility testing in the local development runs.
    //runtimeOnly fg.deobf("local.runtime:bettercombat-forge:1.9.0+1.20.1")
    runtimeOnly fg.deobf("local.runtime:player-animation-lib-forge:1.0.2-rc1+1.20")
    runtimeOnly fg.deobf("local.runtime:cloth-config:11.1.136-forge")
    runtimeOnly fg.deobf("local.runtime:SlashBladeResharped:1.20.1-1.9.65")
    //兼容
    // ImmediatelyFast bakes SRG names straight into its mixins without a refmap, so the plain
    // fg.deobf jar crashes dev runs. Compile against it, but run the remapped copy (see
    // remapImmediatelyFastForDev below).
    compileOnly fg.deobf("curse.maven:immediatelyfast-686911:8348481")
    immediatelyFastDeobf fg.deobf("curse.maven:immediatelyfast-686911:8348481")
    runtimeOnly files(immediatelyFastDevJar).builtBy('remapImmediatelyFastForDev')
    //latex_form处理
    implementation fg.deobf("curse.maven:changed-minecraft-mod-661527:8217446")//可选依赖
    //mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

/*
 * ImmediatelyFast (Architectury Loom build) writes SRG names (m_xxx_/f_xxx_) directly into its
 * mixin annotations and @Shadow members and ships no refmap. fg.deobf only renames bytecode
 * references to Minecraft members, and mixin.env.remapRefMap only rewrites refmap entries, so
 * in the official-mapped dev runtime its injections find no targets and the game crashes.
 * This rewrites every remaining SRG token in the deobf'd jar (member names, annotation strings,
 * string constants) to the official name using ForgeGradle's SRG->official table. SRG ids are
 * globally unique, so a flat name lookup is exact. Dev runs only; never shipped.
 */
def remapImmediatelyFastForDev = tasks.register('remapImmediatelyFastForDev') {
    def srgFile = layout.buildDirectory.file('createSrgToMcp/output.srg')
    dependsOn 'createSrgToMcp'
    inputs.files(configurations.immediatelyFastDeobf)
    inputs.file(srgFile)
    outputs.file(immediatelyFastDevJar)
    doLast {
        Map<String, String> names = [:]
        srgFile.get().asFile.eachLine { String line ->
            if (line.startsWith('MD: ') || line.startsWith('FD: ')) {
                String[] parts = line.split(' ')
                String from = parts[1].substring(parts[1].lastIndexOf('/') + 1)
                String toPath = line.startsWith('MD: ') ? parts[3] : parts[2]
                String to = toPath.substring(toPath.lastIndexOf('/') + 1)
                if (from ==~ /[mf]_\d+_/) names[from] = to
            }
        }
        def remapText = { String text -> text.replaceAll(/[mf]_\d+_/) { String token -> names[token] ?: token } }
        def remapper = new org.objectweb.asm.commons.Remapper() {
            @Override
            String mapMethodName(String owner, String name, String descriptor) { names[name] ?: name }
            @Override
            String mapFieldName(String owner, String name, String descriptor) { names[name] ?: name }
            @Override
            Object mapValue(Object value) { value instanceof String ? remapText(value) : super.mapValue(value) }
        }

        File input = configurations.immediatelyFastDeobf.singleFile
        File output = immediatelyFastDevJar.get().asFile
        output.parentFile.mkdirs()
        int changed = 0
        new java.util.jar.JarFile(input).withCloseable { jar ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(output)).withCloseable { out ->
                jar.entries().each { java.util.jar.JarEntry entry ->
                    // Rewriting classes invalidates any signature files.
                    if (entry.name ==~ /META-INF\/[^\/]+\.(SF|RSA|DSA|EC)/) return
                    byte[] bytes = jar.getInputStream(entry).bytes
                    if (entry.name.endsWith('.class')) {
                        def reader = new org.objectweb.asm.ClassReader(bytes)
                        def writer = new org.objectweb.asm.ClassWriter(0)
                        reader.accept(new org.objectweb.asm.commons.ClassRemapper(writer, remapper), 0)
                        byte[] remapped = writer.toByteArray()
                        if (!Arrays.equals(bytes, remapped)) changed++
                        bytes = remapped
                    }
                    out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    out.write(bytes)
                    out.closeEntry()
                }
            }
        }
        logger.lifecycle("Remapped SRG names in ${changed} ImmediatelyFast classes -> ${output}")
    }
}

// IDE run configurations read the runtime classpath directly; make sure the jar exists.
tasks.matching { it.name == 'prepareRuns' }.configureEach { dependsOn remapImmediatelyFastForDev }

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'forge_version': project.forge_version,
                'mod_id': project.mod_id,
                'mod_name': project.mod_name
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    add sourceSets.main, 'shape_shifter_curse.mixins.refmap.json'
    config "shape_shifter_curse.mixins.json"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = project.mod_id
            version = project.version

            // ForgeGradle's reobfuscated output is the jar that can run in-game.
            artifact layout.buildDirectory.file('reobfJar/output.jar')
        }
    }
    repositories {
        maven {
            name = 'localModRepository'
            url = layout.projectDirectory.dir('maven-repo')
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    dependsOn 'reobfJar'
}
